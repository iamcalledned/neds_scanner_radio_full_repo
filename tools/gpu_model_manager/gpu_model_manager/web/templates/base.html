<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GPU Model Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <nav class="topnav">
    <div class="nav-brand">GPU Model Manager</div>
    <div class="nav-links">
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/gpu" {% if request.url.path == "/gpu" %}class="active"{% endif %}>GPU</a>
      <a href="/runtimes" {% if request.url.path == "/runtimes" %}class="active"{% endif %}>Runtimes</a>
      <a href="/services" {% if request.url.path == "/services" %}class="active"{% endif %}>Services</a>
      <a href="/policy" {% if request.url.path == "/policy" %}class="active"{% endif %}>Policy</a>
      <a href="/leases" {% if request.url.path == "/leases" %}class="active"{% endif %}>Leases</a>
      <a href="/logs" {% if request.url.path == "/logs" %}class="active"{% endif %}>Logs</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h1>{% block heading %}{% endblock %}</h1>
    </div>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/dashboard.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
