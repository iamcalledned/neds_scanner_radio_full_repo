[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular_dashboard"
version = "1.0.0"
description = "Phase 1 — Scanner Control Center"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "PySide6>=6.7.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modular_dashboard*"]
